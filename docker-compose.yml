version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: fakenews_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fakenews_db

  # Python AIML Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: fakenews_ml_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  # Node.js / Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fakenews_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/fakenews_db
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=super_secure_fake_news_detector_jwt_secret_key_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
    depends_on:
      - mongodb
      - ml-service

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fakenews_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
